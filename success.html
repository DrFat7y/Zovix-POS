<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zovix POS - تسجيل الدخول ناجح</title>
    <!-- استيراد خط القاهرة (Cairo) المستخدم في التطبيق -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- مكتبة FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* ألوان متطابقة مع هوية Zovix POS المظلمة (AppColors) */
            --primary: #613C9E;         /* Purple */
            --accent: #C53E8F;          /* Magenta */
            --highlight: #F0575B;       /* Coral */
            --bg-color: #1C1C1E;        /* خلفية التطبيق المظلمة */
            --surface: #2C2C2E;         /* المربعات والبطاقات المظلمة */
            --text-main: #F2F2F7;       /* لون النص الأساسي */
            --text-muted: #8E8E93;      /* لون نص ثانوي رمادي فاتح */
            --success: #34C759;         /* لون النجاح (الأخضر) */
            --border-color: #48484A;    /* لون الحدود في الوضع المظلم */
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            background-color: var(--surface);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            max-width: 420px;
            width: 90%;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .success-icon-container {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--accent), var(--highlight));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 36px;
            box-shadow: 0 8px 24px rgba(197, 62, 143, 0.4);
            animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
            animation-delay: 0.2s;
            opacity: 0;
            transform: scale(0);
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        h1 {
            color: var(--text-main);
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 10px;
            line-height: 1.3;
        }

        p {
            color: var(--text-muted);
            font-size: 16px;
            font-weight: 400;
            margin: 0 0 30px;
            line-height: 1.6;
        }

        .loader-text {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--accent);
            font-size: 15px;
            font-weight: 600;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(197, 62, 143, 0.2);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .brand-footer {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .brand-footer p {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
        }

        /* يمكنك وضع الشعار الخاص بزوفيكس هنا بدلاً من النص إذا أردت */
        .brand-logo {
            font-weight: 700;
            font-size: 20px;
            background: linear-gradient(135deg, var(--primary), var(--accent), var(--highlight));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- أيقونة النجاح بخلفية الجراديانت المعتمد في التصميم -->
        <div class="success-icon-container">
            <i class="fa-solid fa-check"></i>
        </div>
        
        <!-- النصوص -->
        <h1>مرحباً بك في Zovix POS</h1>
        <p>تم تسجيل الدخول بنجاح عبر حساب جوجل. جاري نقلك إلى التطبيق لتستكمل عملك بأمان وبسرعة.</p>
        
        <!-- علامة التحميل وإظهار تقدم الانتقال -->
        <div class="loader-text">
            <div class="spinner"></div>
            <span>جاري العودة للتطبيق...</span>
        </div>

        <div class="brand-footer">
            <span class="brand-logo">ZOVIX</span>
            <p>نظام نقاط البيع الاحترافي الأحدث</p>
        </div>
    </div>

    <!-- كود التحويل للويندوز ديسكتوب (Deep Link Injection) -->
    <script>
        window.onload = function() {
            // ننتظر ثانية ونصف حتى يتمكن المستخدم من قراءة رسالة "تم الدخول بنجاح"
            setTimeout(function() {
                // استخراج الرموز والمعلومات من الرابط القادم من جوجل (Query & Hash)
                var searchParams = window.location.search;
                var hashParams = window.location.hash;

                // إعادة توجيه المستخدم لفتح تطبيق الديسكتوب المحمل لديه 
                // Zovix POS Scheme (zovix://login)
                window.location.href = "zovix://login" + searchParams + hashParams;

                // بعد ثانيتين من إرساله للتطبيق، نُغيّر نص الصفحة لتشجيعه على الإغلاق
                setTimeout(function() {
                    document.querySelector('.loader-text').innerHTML = 
                    "<div style='color: var(--success); display:flex; align-items:center; gap:8px;'>" +
                        "<i class='fa-solid fa-circle-check'></i>" +
                        "<span>تم نقل البيانات! يمكنك إغلاق هذه النافذة بأمان.</span>" + 
                    "</div>";
                }, 1500);

            }, 1000);
        };
    </script>
</body>
</html>
